id = "herdr-cliproxyapi-quotas"
name = "Herdr Cli Proxy API Quotas Plugin"
version = "0.1.3"
min_herdr_version = "0.9.0"
description = "View CLIProxyAPI account quotas and version status in a Herdr Tab."
platforms = ["linux", "macos", "windows"]

[[build]]
command = ["go", "build", "-trimpath", "-o", "bin/cpa-quotas", "./cmd/cpa-quotas"]
platforms = ["linux", "macos"]

[[build]]
command = ["go", "build", "-trimpath", "-o", "bin/cpa-quotas.exe", "./cmd/cpa-quotas"]
platforms = ["windows"]

[[actions]]
id = "open"
title = "Open CPA quotas"
command = ["bin/cpa-quotas", "open"]

[[actions]]
id = "shortcut"
title = "Install prefix+u shortcut"
command = ["bin/cpa-quotas", "shortcut"]

[[panes]]
id = "quotas"
title = "CPA Quotas"
placement = "split"
command = ["bin/cpa-quotas"]
